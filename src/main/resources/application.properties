spring.application.name=farmers_services
server.port=8019
# Database Configuration
logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.org.apache.http.wire=DEBUG
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
spring.datasource.url=jdbc:mysql://localhost:3306/farmers_services
#spring.datasource.url=jdbc:mysql://10.0.0.91:3306/notification_service?zeroDateTimeBehavior=convertToNull&useSSL=false
spring.datasource.username=root
spring.datasource.password=
#spring.datasource.password=123@Today
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.devtools.livereload.enabled=true

# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
